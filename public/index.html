<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AfterDark Search</title>
<style>
:root{--bg:#0e0e12;--card:#191920;--fg:#ececf1;--mut:#9a9aa8;--acc:#ff4d6d;--bd:#2a2a35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px;border-bottom:1px solid var(--bd);z-index:5}
h1{font-size:18px;margin:0 0 10px}h1 span{color:var(--acc)}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px}
button,select{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;font-size:14px}
button.go{background:var(--acc);border-color:var(--acc);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips label{padding:5px 10px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;color:var(--mut);user-select:none}
.chips input{display:none}.cat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:84px;overflow:auto}.cat b{width:100%;font-size:12px;color:var(--mut)}.cat button{padding:4px 10px;border-radius:99px;font-size:13px;color:var(--mut)}.cat button.on{background:var(--acc);border-color:var(--acc);color:#fff}.chips label:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.chips .bad{outline:1px solid #b33}
#status{padding:8px 16px;color:var(--mut);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:0 16px 20px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--bd)}
.card:hover{border-color:var(--acc)}
.th{position:relative;aspect-ratio:16/9;background:#000}.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur,.src{position:absolute;bottom:6px;padding:2px 6px;border-radius:4px;background:#000c;font-size:12px}.dur{right:6px}.src{left:6px;color:var(--acc)}
.info{padding:8px 10px}.t{font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden}.m{color:var(--mut);font-size:12px;margin-top:4px}
#more{display:block;margin:0 auto 30px}
#gate,#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#gate{display:flex;background:var(--bg)}#gate div{max-width:420px;text-align:center}
#modal .box{width:min(1100px,100%);background:var(--card);border-radius:10px;overflow:hidden}
.player{aspect-ratio:16/9;background:#000}.player iframe,.player video{width:100%;height:100%;border:0}
.bar{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;align-items:center}.bar a{color:var(--acc)}
</style></head><body>
<div id="gate"><div><h1>AfterDark <span>Search</span></h1><p>This site contains sexually explicit material. You must be 18 or older (or the age of majority where you live) to enter.</p>
<button class="go" id="yes">I am 18+ — Enter</button> <button id="no">Leave</button></div></div>
<header><h1>AfterDark <span>Search</span></h1>
<form id="f"><input type="search" id="q" placeholder="Keywords and/or pick categories below…" autocomplete="off">
<select id="sort"><option value="best">Best match</option><option value="rating">Top rated</option><option value="relevant">Most relevant</option><option value="views">Most viewed</option></select>
<button class="go">Search</button></form><div class="chips" id="chips"></div><div id="cats"></div></header>
<div id="status">Search to begin.</div><div id="grid"></div><button id="more" hidden>Load more</button>
<div id="modal"><div class="box"><div class="player" id="player"></div><div class="bar"><div id="ptitle"></div><span><a id="plink" target="_blank" rel="noopener noreferrer">Open on site ↗</a> · <button id="close">Close</button></span></div></div></div>
<script>
const $=s=>document.querySelector(s);let page=1,lastQ='',provs=[];
const ok=()=>{try{return localStorage.getItem('age18')==='1'}catch{return false}};
if(ok())$('#gate').style.display='none';
$('#yes').onclick=()=>{try{localStorage.setItem('age18','1')}catch{}$('#gate').style.display='none'};
$('#no').onclick=()=>location.href='https://www.google.com';
fetch('/api/providers').then(r=>r.json()).then(p=>{provs=p;$('#chips').innerHTML=p.map(x=>`<label data-id="${x.id}"><input type="checkbox" value="${x.id}" checked>${x.name}</label>`).join('')});
const sel=new Set();
fetch('/api/categories').then(r=>r.json()).then(g=>{$('#cats').innerHTML=g.map(x=>`<div class="cat"><b>${esc(x.group)}</b>${x.items.map(i=>`<button type="button" data-c="${esc(i)}">${esc(i)}</button>`).join('')}</div>`).join('')});
$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);b.classList.toggle('on');$('#f').requestSubmit()};
const fmt=s=>{s=+s||0;const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(u)?u:'';
let vids=[];
async function run(reset){
  if(reset){page=1;vids=[];$('#grid').innerHTML='';}
  const src=[...document.querySelectorAll('#chips input:checked')].map(i=>i.value).join(',');
  $('#status').textContent='Searching…';
  const r=await fetch(`/api/search?q=${encodeURIComponent(lastQ)}&page=${page}&sort=${$('#sort').value}&sources=${src}`);
  const d=await r.json();
  if(!r.ok){$('#status').textContent=d.error;return}
  document.querySelectorAll('.chips label').forEach(l=>{const s=d.status[l.dataset.id];l.classList.toggle('bad',!!s&&!s.ok);l.title=s?(s.ok?s.count+' results':s.error):''});
  const start=vids.length;vids=vids.concat(d.videos);
  $('#grid').insertAdjacentHTML('beforeend',d.videos.map((v,i)=>`<div class="card" data-i="${start+i}"><div class="th"><img loading="lazy" src="${esc(safeUrl(v.thumb))}" alt=""><span class="src">${esc(v.provider)}</span><span class="dur">${fmt(v.duration)}</span></div><div class="info"><div class="t">${esc(v.title)}</div><div class="m">${v.rating!=null?'★ '+Math.round(v.rating*100)+'% · ':''}${(v.views||0).toLocaleString()} views</div></div></div>`).join(''));
  const failed=Object.entries(d.status).filter(([,s])=>!s.ok).map(([k])=>k);
  $('#status').textContent=`${vids.length} videos`+(failed.length?` · unavailable: ${failed.join(', ')}`:'');
  $('#more').hidden=!d.videos.length;
}
$('#f').onsubmit=e=>{e.preventDefault();lastQ=[$('#q').value.trim(),...sel].filter(Boolean).join(' ');if(!lastQ){$('#status').textContent='Enter a keyword or pick a category';return}run(true)};
$('#more').onclick=()=>{page++;run(false)};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(!c)return;const v=vids[c.dataset.i],p=v.player,u=safeUrl(p.src);if(!u)return;
  $('#player').innerHTML=p.type==='video'?`<video src="${esc(u)}" poster="${esc(safeUrl(p.poster))}" controls autoplay loop playsinline></video>`:`<iframe src="${esc(u)}" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>`;
  $('#ptitle').textContent=v.title;$('#plink').href=safeUrl(v.pageUrl);$('#modal').style.display='flex'};
const closeM=()=>{$('#modal').style.display='none';$('#player').innerHTML=''};
$('#close').onclick=closeM;$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
</script></body></html>
